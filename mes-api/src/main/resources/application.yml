server:
  port: 8081
  address: 127.0.0.1

spring:
  application:
    name: mes-api
  datasource:
    url: jdbc:postgresql://localhost:55432/mes
    username: mes
    password: mes
  # 요청 JSON을 읽는 방식을 레거시(ASP.NET)에 맞춘다
  jackson:
    mapper:
      accept-case-insensitive-properties: true   # "PlantCd"도 plantCd로 읽는다
    deserialization:
      accept-float-as-int: false                 # 10.5를 int로 잘라 받지 않고 400으로 거절한다

# 설비 TCP 게이트웨이 (4단계). 전문 규격은 docs/04-equipment-interface.md
mes:
  equipment:
    port: 9101
    bind-address: 127.0.0.1    # WAS처럼 루프백에서만 받는다
    read-timeout: 30s          # 이 시간 동안 아무것도 오지 않으면 연결을 닫는다. 설비는 10초마다 HBT를 보낸다
    max-connections: 50

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # plant_cd 컬럼을 plantCd 필드(레코드 생성자 인자)에 연결한다
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

logging:
  level:
    # MyBatis가 실행하는 SQL과 파라미터를 로그로 보여준다
    com.minimes: debug
