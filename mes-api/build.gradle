plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.minimes'
version = '0.0.1-SNAPSHOT'
description = 'Mini MES Java WAS'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Windows의 Java 17은 소스 파일을 MS949로 읽을 수 있어서, 한글이 깨지지 않게 UTF-8로 고정한다
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// DB 컨테이너가 필요한 테스트(@Tag("db"))는 기본 test에서 빼고 dbTest로 따로 돌린다.
// 테스트용 DB를 새로 만들어 쓰므로 개발 DB의 데이터는 바뀌지 않는다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'db'
	}
}

tasks.register('dbTest', Test) {
	description = 'DB 컨테이너(localhost:55432)가 필요한 테스트를 실행한다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'db'
	}
}
