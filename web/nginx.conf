# WEB 계층: 화면(정적 파일)을 내려주고, API 요청은 경로 앞부분을 보고 해당 WAS로 넘긴다.
#   /legacy/api/... → C# 레거시 (localhost:5080)
#   /java/api/...   → Java      (localhost:8081)
# 화면은 /legacy 와 /java 중 무엇을 붙일지만 고르고, 나머지 주소는 똑같다.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    sendfile off;

    location / {
        add_header Cache-Control "no-store";
    }

    location /legacy/ {
        proxy_pass http://host.docker.internal:5080/;
        add_header X-Upstream "legacy-csharp $upstream_addr" always;
    }

    location /java/ {
        proxy_pass http://host.docker.internal:8081/;
        add_header X-Upstream "java $upstream_addr" always;
    }
}
