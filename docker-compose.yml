services:
  postgres:
    image: postgres:16
    container_name: mini-mes-postgres
    environment:
      POSTGRES_DB: mes
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      TZ: UTC
    ports:
      - "55432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: mini-mes-web
    ports:
      - "3000:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    # Docker Desktop(Windows/Mac)은 host.docker.internal을 IPv4로 알려준다.
    # Linux에서는 아래 두 줄을 추가해야 한다. (WAS는 localhost에서만 받으므로 IPv4로 연결되어야 함)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  pgdata:
